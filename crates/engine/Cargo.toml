[package]
name = "flip3d"
version = "1.7.1"
edition = "2021"
authors = ["caliberda (original mod)", "Antigravity (Rust port)"]
license = "MIT"
description = "Fluid, Windows Vista-style Flip 3D window switcher for Windows 10 & 11"

[dependencies]
settings-core = { path = "../settings-core" }
settings-ui = { path = "../settings-ui" }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_HiDpi",
    "Win32_Storage_FileSystem",
    "Win32_Security_Authorization",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Foundation_Numerics",
    "Foundation",
] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
windows-core = "0.62.2"
windows-numerics = "0.3.1"
